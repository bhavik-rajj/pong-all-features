<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#070914">
  <title>NEON PONG — Arcade</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">

    <header class="topbar">
      <div>
        <div class="eyebrow">ARCADE MODE</div>
        <h1>NEON <span>PONG</span></h1>
      </div>

      <button id="soundBtn" class="icon-btn" aria-label="Toggle sound">🔊</button>
    </header>

    <section class="menu card" id="menu">
      <p class="tagline">Classic Pong. Faster. Brighter. Smarter.</p>

      <div class="difficulty">
        <button data-level="easy">EASY</button>
        <button data-level="normal" class="active">NORMAL</button>
        <button data-level="hard">HARD</button>
      </div>

      <div class="mode-row">
        <button id="startBtn" class="primary">START GAME</button>
      </div>

      <div class="best-row">
        <span>BEST SCORE</span>
        <strong id="bestScore">0</strong>
      </div>
    </section>

    <section class="game-wrap hidden" id="gameWrap">

      <div class="hud">
        <div class="score-box">
          <small>YOU</small>
          <strong id="playerScore">0</strong>
        </div>

        <div class="round-box">
          <span id="roundText">ROUND 1</span>
          <small id="statusText">READY</small>
        </div>

        <div class="score-box">
          <small>AI</small>
          <strong id="aiScore">0</strong>
        </div>
      </div>

      <div class="canvas-card">
        <canvas id="game" aria-label="Pong game"></canvas>
        <div class="countdown hidden" id="countdown">3</div>
      </div>

      <div class="controls">
        <button id="pauseBtn">Ⅱ PAUSE</button>
        <button id="restartBtn">↻ RESTART</button>
        <button id="menuBtn">⌂ MENU</button>
      </div>

      <p class="hint">
        Move with <b>W/S</b> or <b>↑/↓</b> • On mobile, drag on the game area
      </p>

    </section>

    <section class="result card hidden" id="result">

      <div class="win-icon" id="resultIcon">🏆</div>

      <h2 id="resultTitle">YOU WIN!</h2>

      <p id="resultText">Great rally.</p>

      <button id="playAgainBtn" class="primary">
        PLAY AGAIN
      </button>

      <button id="resultMenuBtn" class="secondary">
        MAIN MENU
      </button>

    </section>

    <footer>
      NEON PONG • Runs entirely in your browser
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
